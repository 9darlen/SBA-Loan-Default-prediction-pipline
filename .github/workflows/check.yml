name: Python Basic Check
on: [push] # 每次推送到 GitHub 都會觸發

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 對齊實習環境版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Run Unit Tests (Quality Gate)
        # 確保 FeatureBuilder 邏輯穩健
        run: python -m unittest discover tests

      - name: 2. Run Smoke Test Training
        # 啟動測試模式，確保能產出 test_pipeline.joblib
        run: python training/pipelines/train_pipeline.py --mode=test

      - name: 3. Syntax Check
        run: python -m py_compile app/page.py app/main.py app/api/routes.py app/schemas/prediction.py app/core/config.py app/services/prediction_service.py feature_builder.py training/features/feature_builder.py training/pipelines/train_pipeline.py tests/api/test_prediction_api.py tests/unit/test_pipeline.py tests/unit/test_prediction_service.py tests/regression/test_model_regression.py

      - name: Upload Test Model Artifact 
        # 將測試產出的 joblib 暫存，方便你確認流程是否真的跑通
        uses: actions/upload-artifact@v4
        with:
          name: test-pipeline-artifact
          path: models/artifacts/test_pipeline.joblib
